server.port: 3000
spring:
  application.name: order-service
  data.mongodb.uri: ${MONGODB_URI:mongodb://admin:123456@localhost:27017/orderflow?authSource=admin}
spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: com.orderflow.contracts
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer.key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    consumer.value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
management.endpoints.web.exposure.include: health,info,metrics,prometheus
