name: OrderFlow CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Java 21 · Maven · Reliability Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify all modules
        run: mvn -B -ntp clean verify

  compose:
    name: Docker Compose · Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate infrastructure compose
        run: docker compose -f docker-compose.yml config --quiet
      - name: Validate full stack compose
        run: docker compose -f docker-compose.yml -f compose-apps.yml config --quiet
      - name: Validate Prometheus configuration
        run: |
          docker run --rm \
            -v "$PWD/observability:/etc/prometheus:ro" \
            --entrypoint /bin/promtool \
            prom/prometheus:v3.13.1 \
            check config /etc/prometheus/prometheus.yml
